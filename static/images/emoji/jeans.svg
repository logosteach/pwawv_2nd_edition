<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="jeans">
  <title>jeans</title>
  <!-- hips + two long legs with a clear gap -->
  <path d="M17 17
           L15.5 28
           L17 58
           Q17 61.5 20 61.5
           H26
           Q29 61.5 29 58
           L30.2 32
           Q32 28.5 33.8 32
           L35 58
           Q35 61.5 38 61.5
           H44
           Q47 61.5 47 58
           L48.5 28
           L47 17
           Z"
        fill="#2F7FC1" stroke="#0E6F86" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- waistband -->
  <path d="M16.5 8.5
           Q16.5 6 19.5 6
           H44.5
           Q47.5 6 47.5 8.5
           V17
           Q47.5 19.5 44.5 19.5
           H19.5
           Q16.5 19.5 16.5 17
           Z"
        fill="#3A6EA5" stroke="#0E6F86" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M21 10.5 H43" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2.2" stroke-linecap="round"/>
  <!-- gold button -->
  <circle cx="32" cy="12.8" r="2.5" fill="#FDC02A" stroke="#0E6F86" stroke-width="1.6"/>
  <!-- fly -->
  <path d="M32 16.5 V28" fill="none" stroke="#FDC02A" stroke-width="1.8" stroke-linecap="round"/>
  <!-- front pocket stitching (short, high, no brand tab) -->
  <path d="M20 22 Q20.2 27.5 24.5 29.5" fill="none" stroke="#FDC02A" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M44 22 Q43.8 27.5 39.5 29.5" fill="none" stroke="#FDC02A" stroke-width="2.1" stroke-linecap="round"/>
  <!-- outseams -->
  <path d="M17.8 22 L19.2 56.5" fill="none" stroke="#24537A" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M46.2 22 L44.8 56.5" fill="none" stroke="#24537A" stroke-width="1.7" stroke-linecap="round"/>
  <!-- ankle hems -->
  <path d="M20 57.5 H26.5" fill="none" stroke="#24537A" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M37.5 57.5 H44" fill="none" stroke="#24537A" stroke-width="1.6" stroke-linecap="round"/>
</svg>
