  <path d="M50.50 23.80 L51.50 26.62 L54.49 26.70 L52.12 28.53 L52.97 31.40 L50.50 29.70 L48.03 31.40 L48.88 28.53 L46.51 26.70 L49.50 26.62 Z" fill="#0E6F86"/>
