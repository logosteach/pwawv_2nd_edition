<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="envelope">
  <title>envelope</title>
  <!-- body -->
  <path d="M6 18 H58 Q61 18 61 21 V50 Q61 56 55 56 H9 Q3 56 3 50 V21 Q3 18 6 18 Z" fill="#FBF3E4" stroke="#0E6F86" stroke-width="4" stroke-linejoin="round"/>
  <!-- sealed flap folds, stopping at the wax seal (stamp draws on top of the right fold) -->
  <path d="M6 18 L26.35 33.65" fill="none" stroke="#0E6F86" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M58 18 L37.65 33.65" fill="none" stroke="#0E6F86" stroke-width="3.2" stroke-linecap="round"/>
