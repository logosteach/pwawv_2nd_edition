  <circle cx="32" cy="40" r="7.2" fill="#E24A1C" stroke="#0E6F86" stroke-width="2"/>
  <path d="M32 45 C26.8 41.4 27.5 37.6 30.1 37.6 C31.2 37.6 32 38.7 32 39.5 C32 38.7 32.8 37.6 33.9 37.6 C36.5 37.6 37.2 41.4 32 45 Z" fill="#FBF3E4"/>
</svg>
