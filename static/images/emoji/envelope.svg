  <path d="M9 28 Q10 23 14 21" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2.6" stroke-linecap="round"/>
  <!-- generic stamp (gold plate + teal star; not a real issue) -->
